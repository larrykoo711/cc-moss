name: Feature request
description: An idea that would make cc-moss better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas welcome. The best ones start with the problem rather than the solution.
        中文也可以。
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: "How could cc-moss help? Commands, picker behaviour, config: sketch it."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Picker
        - Restore / registry
        - new / note / ls / close
        - install / doctor (tmux, starship, shell)
        - Languages and wording
        - Something else
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
