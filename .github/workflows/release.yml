name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Dry run: build and package this branch or tag, publish nothing"
        default: main
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle-licenses
      # Binary archives must carry the notices of every dependency compiled in
      # (MIT/Apache require it; nucleo-matcher is MPL-2.0, source linked there).
      - run: cargo bundle-licenses --format toml --output THIRD-PARTY-LICENSES.toml
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.toml
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          # app_arch: the menubar app built for the same machine, shipped in
          # the same archive (DESIGN-menubar A12).
          - { target: aarch64-apple-darwin,       os: macos-latest, app_arch: arm64 }
          - { target: x86_64-apple-darwin,        os: macos-latest, app_arch: x86_64 }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$have" ] || { echo "tag $TAG but Cargo.toml says $have"; exit 1; }
      - name: Build
        run: cargo build --release --locked -p cc-moss --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: ./target/${{ matrix.target }}/release/cc-moss --version | tee /dev/stderr | grep -q "^cc-moss "
      - name: Build the menubar app
        if: matrix.app_arch
        run: |
          apps/macos/scripts/bundle.sh --arch ${{ matrix.app_arch }}
          apps/macos/scripts/check-bundle.sh
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
      - name: Package
        shell: bash
        env:
          # macOS tar would add ._* files for extended attributes.
          COPYFILE_DISABLE: "1"
        run: |
          # A dry run of a branch like feature/x must not put a slash in the name.
          name="cc-moss-${TAG//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cc-moss" LICENSE THIRD-PARTY-LICENSES.toml README.md README.en.md CHANGELOG.md "dist/$name/"
          if [ -n "${{ matrix.app_arch }}" ]; then
            cp -R apps/macos/build/cc-moss.app "dist/$name/"
          fi
          # Owner 0 in the archive: an extraction under sudo must not hand the
          # binary to whichever local user shares the build machine's uid.
          if tar --version 2>/dev/null | grep -q GNU; then
            tar --owner=0 --group=0 --numeric-owner -C dist -czf "dist/$name.tar.gz" "$name"
          else
            tar --uid 0 --gid 0 -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $version"; exit 1; }
          cat dist/*.sha256 > dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc.1 is a pre-release, never GitHub's "latest".
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --title "cc-moss $TAG" --notes-file notes.md --verify-tag $pre

  homebrew:
    name: Bump Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    # TAP_DEPLOY_KEY: the private half of a deploy key with write access to
    # larrykoo711/homebrew-tap and nothing else (no personal token, no expiry).
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Is there a deploy key for the tap?
        id: token
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          if [ -n "$TAP_DEPLOY_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No TAP_DEPLOY_KEY secret: update Formula/cc-moss.rb in larrykoo711/homebrew-tap by hand"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          repository: larrykoo711/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Render Formula/cc-moss.rb
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          packaging/homebrew/render.sh "$TAG" SHA256SUMS > tap/Formula/cc-moss.rb
      - name: Commit and push
        if: steps.token.outputs.ok == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cc-moss.rb
          # A re-run of the same release changes nothing: no empty commit.
          git diff --cached --quiet || { git commit -m "cc-moss ${TAG}" && git push; }

  # A dry run checks what a release would ship, without publishing: the
  # archives carry the app on macOS only, the app's signature survives the
  # trip, and the formula renders from the checksums.
  check:
    name: Check the archives and the formula
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Archives
        shell: bash
        run: |
          tag="${TAG//\//-}"
          cd dist
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            name="cc-moss-$tag-$t"
            mkdir -p "x/$t" && tar -xzf "$name.tar.gz" -C "x/$t"
            ../apps/macos/scripts/check-bundle.sh "x/$t/$name/cc-moss.app"
            # Listed first: grep -q closing the pipe early would fail it.
            files="$(tar -tzf "$name.tar.gz")"
            if grep -q '/\._' <<<"$files"; then echo "$name has ._ files"; exit 1; fi
          done
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            files="$(tar -tzf "cc-moss-$tag-$t.tar.gz")"
            if grep -q 'cc-moss.app' <<<"$files"; then echo "$t must not carry the app"; exit 1; fi
            grep -qx "cc-moss-$tag-$t/cc-moss" <<<"$files"
          done
      - name: Formula
        shell: bash
        run: |
          tag="${TAG//\//-}"
          cat dist/*.sha256 > SHA256SUMS
          packaging/homebrew/render.sh "$tag" SHA256SUMS > cc-moss.rb
          ruby -c cc-moss.rb
          grep -q 'prefix.install "cc-moss.app"' cc-moss.rb
