name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Dry run: build and package this branch or tag, publish nothing"
        default: main
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle-licenses
      # Binary archives must carry the notices of every dependency compiled in
      # (MIT/Apache require it; nucleo-matcher is MPL-2.0, source linked there).
      - run: cargo bundle-licenses --format toml --output THIRD-PARTY-LICENSES.toml
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.toml
          if-no-files-found: error

  build:
    name: build ${{ matrix.target }}
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          want="${TAG#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$want" = "$have" ] || { echo "tag $TAG but Cargo.toml says $have"; exit 1; }
      - name: Build
        run: cargo build --release --locked -p cc-moss --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        run: ./target/${{ matrix.target }}/release/cc-moss --version | tee /dev/stderr | grep -q "^cc-moss "
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Package
        shell: bash
        run: |
          # A dry run of a branch like feature/x must not put a slash in the name.
          name="cc-moss-${TAG//\//-}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cc-moss" LICENSE THIRD-PARTY-LICENSES.toml README.md README.zh-CN.md CHANGELOG.md "dist/$name/"
          # Owner 0 in the archive: an extraction under sudo must not hand the
          # binary to whichever local user shares the build machine's uid.
          if tar --version 2>/dev/null | grep -q GNU; then
            tar --owner=0 --group=0 --numeric-owner -C dist -czf "dist/$name.tar.gz" "$name"
          else
            tar --uid 0 --gid 0 -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $version"; exit 1; }
          cat dist/*.sha256 > dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag like v0.2.0-rc.1 is a pre-release, never GitHub's "latest".
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --title "cc-moss $TAG" --notes-file notes.md --verify-tag $pre

  homebrew:
    name: Bump Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    # Fine-grained PAT, Contents: read/write on larrykoo711/homebrew-tap only.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Is there a token for the tap?
        id: token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No TAP_TOKEN secret: update Formula/cc-moss.rb in larrykoo711/homebrew-tap by hand"
          fi
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: larrykoo711/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
      - name: Render Formula/cc-moss.rb
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          sum() { awk -v f="cc-moss-${TAG}-$1.tar.gz" '$2 == f { print $1 }' SHA256SUMS; }
          sed -e "s/@VERSION@/$version/g" \
              -e "s/@SHA_DARWIN_ARM@/$(sum aarch64-apple-darwin)/" \
              -e "s/@SHA_DARWIN_X64@/$(sum x86_64-apple-darwin)/" \
              -e "s/@SHA_LINUX_ARM@/$(sum aarch64-unknown-linux-musl)/" \
              -e "s/@SHA_LINUX_X64@/$(sum x86_64-unknown-linux-musl)/" \
              packaging/homebrew/cc-moss.rb.in > tap/Formula/cc-moss.rb
          if grep -q '@[A-Z_]*@' tap/Formula/cc-moss.rb; then echo "unfilled placeholder"; exit 1; fi
      - name: Commit and push
        if: steps.token.outputs.ok == 'true'
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cc-moss.rb
          git commit -m "cc-moss ${TAG}"
          git push
