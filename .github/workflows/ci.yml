name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # tmux refuses to start some commands without a usable terminal type.
  TERM: xterm-256color

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release builds keep one worker pool per process
        run: |
          cargo tree -p cc-moss -e normal,build,features -i moss-core --locked > tree.txt
          if grep -q test-permits tree.txt; then cat tree.txt; exit 1; fi
          cargo tree -p cc-moss -e features -i moss-core --locked | grep -q test-permits # the check can see it
      - name: Shell assets parse
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          for f in crates/cc-moss/assets/zsh/*.zsh; do zsh -n "$f"; done

  test:
    name: test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # zsh: the alias end-to-end test runs in bash and zsh.
      - name: Install tmux and zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux zsh
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - run: tmux -V
      # The e2e tests drive real tmux servers on private sockets; shared runners
      # are slower than a laptop, so fewer threads keeps the 10 s waits honest.
      - run: cargo test --all --locked -- --test-threads=4
      # hook_perf.rs is #[ignore]d: a 30 ms p95 budget is a laptop number, not a
      # shared-runner number. Run it by hand or via the perf job below.

  macos-app:
    name: menubar app (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: scripts/swift.sh build
      - run: scripts/swift.sh test
      - name: Bundle and sign
        run: |
          scripts/bundle.sh
          scripts/check-bundle.sh
  formula:
    name: Homebrew formula renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          packaging/homebrew/render.sh v9.9.9 packaging/homebrew/testdata/SHA256SUMS > "$RUNNER_TEMP/cc-moss.rb"
          ruby -c "$RUNNER_TEMP/cc-moss.rb"
          grep -q 'prefix.install "cc-moss.app"' "$RUNNER_TEMP/cc-moss.rb"

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  perf:
    name: hook latency (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install tmux
      - run: cargo test --release -p cc-moss --test hook_perf -- --ignored --nocapture
