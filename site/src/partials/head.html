  <meta name="theme-color" content="#0c0b0a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/styles.css">
  <script>
    // Before anything paints. The URL decides the language and nothing moves you off it; a
    // first-time visitor whose browser reads the other language is offered it (see app.js).
    (function () {
      var root = document.documentElement, store = null;
      root.classList.add("js");
      try { store = localStorage; } catch (e) {}
      if (store && !store.getItem("lang")) {
        var wants = (navigator.languages || [navigator.language || ""]).join(",").toLowerCase();
        var want = /(^|,)zh/.test(wants) ? "zh" : "en";
        if (want !== root.dataset.lang) root.dataset.suggest = want;
      }
      // Skin: the visitor's choice, else the system's.
      var theme = store && store.getItem("theme");
      root.dataset.theme = theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    })();
  </script>
