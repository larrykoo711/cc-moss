[workspace]
resolver = "2"
members = ["crates/moss-core", "crates/cc-moss"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/larrykoo711/cc-moss"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
ulid = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = "thin"
