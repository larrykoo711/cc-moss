[workspace]
resolver = "2"
members = ["crates/moss-core", "crates/cc-moss"]

[workspace.package]
version = "0.3.6"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/larrykoo711/cc-moss"
homepage = "https://cc-moss.larrykoo.com"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
nucleo-matcher = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
ulid = "3"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Never set panic = "abort": the hook relies on catch_unwind to always exit 0.
