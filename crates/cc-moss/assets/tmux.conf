# =============================================================================
# cc-moss tmux configuration
#
# Written by `cc-moss install` and loaded from a small block at the top of
# ~/.tmux.conf. Anything you put after that block in ~/.tmux.conf wins, so
# customise there rather than here: this file is replaced on the next install.
# =============================================================================

# --- Base settings ---
set -g default-terminal "screen-256color"         # 256 colours
set -ga terminal-overrides ",xterm-256color:Tc"   # true colour
set -g history-limit 50000                        # scrollback
set -g mouse on                                   # scroll, select, resize panes
set -g base-index 1                               # windows count from 1
setw -g pane-base-index 1                         # panes count from 1
set -g renumber-windows on                        # no gaps after closing a window
set -sg escape-time 0                             # no ESC delay (vim-friendly)

# --- Prefix key ---
# The default Ctrl-b stays: it does not clash with editors and terminals.

# --- Splits and windows open in the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation (vim style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Quick actions ---
bind r source-file "{{USER_CONF}}" \; display "Config reloaded"
# prefix + t: the cc-moss picker in a popup (tmux 3.2 or newer)
bind t display-popup -E -w 90% -h 85% "cc-moss pick"

# --- Copy mode (vi style) ---
# y copies to the system clipboard: pbcopy on macOS, wl-copy or xclip on
# Linux; over SSH, tmux passes the copy on to your local terminal (OSC 52).
# `external` (tmux's default) lets only tmux itself do that, not every
# program running in a pane.
setw -g mode-keys vi
set -g set-clipboard external
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "command -v pbcopy >/dev/null && exec pbcopy; command -v wl-copy >/dev/null && exec wl-copy; command -v xclip >/dev/null && exec xclip -selection clipboard; cat >/dev/null"

# --- Status bar ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #h #[bg=#1e1e2e,fg=#89b4fa] #S "
set -g status-right "#[fg=#6c7086] %H:%M %Y-%m-%d "
set -g status-right-length 40

# Window labels
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W "

# Keep window names stable: no automatic renaming by the shell.
setw -g automatic-rename off

# --- Session behaviour ---
# Closing a session detaches the client back to the shell (tmux's default).
# `off` would switch to the next session instead, but with several clients on
# different sessions it can land two windows on the same one.
set -g detach-on-destroy on

# --- Pane borders ---
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
