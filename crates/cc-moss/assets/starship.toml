"$schema" = 'https://starship.rs/config-schema.json'

format = """
${custom.ssh}\
${custom.opencap}\
$os\
${custom.device}\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_blue bg:color_bg3)\
$docker_context\
${custom.tmux}\
${custom.proxy}\
$conda\
$pixi\
[](fg:color_bg3 bg:color_bg1)\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
# Muted Chinese red — the SSH badge is meant to be noticed, not to shout over
# the rest of the line. Kept separate from color_red so the error symbol,
# which SHOULD shout, is unaffected.
color_ssh = '#a13d3d'
color_yellow = '#d79921'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"
format = "[$symbol]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
# Replaced by custom.device: when you use several machines as the same user,
# the user name says nothing, while the machine name tells them apart.
disabled = true

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[bun]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[golang]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[php]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[java]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[kotlin]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[haskell]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#83a598 bg:color_bg3)]($style)'

[conda]
style = "bg:color_bg3"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:color_bg3)]($style)'

[pixi]
style = "bg:color_bg3"
format = '[[ $symbol( $version)( $environment) ](fg:color_fg0 bg:color_bg3)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'


# ===================
# Multi-device
# ===================

# Which machine is this: shown always, local or remote. It uses the same name
# as cc-moss's tmux session prefix, so the prompt and the session list agree.
[custom.device]
description = "Machine name"
command = 'printf "%s" "$(scutil --get LocalHostName 2>/dev/null || hostname -s)"'
when = true
format = "[ $output ]($style)"
style = "bg:color_orange fg:color_fg0"
shell = ["bash", "--noprofile", "--norc"]
# The expensive mistake is rarely a wrong command; it is a right command on
# the wrong machine.

# Am I reached over SSH?
#
# The machine's name is already on the line (custom.device), so this says only
# the other half: that you are not sitting at this box. Repeating the hostname
# here would print it twice and make the badge easy to stop noticing — the one
# thing a warning must not become.
# The line's opening cap, drawn only when custom.ssh has not already drawn one.
[custom.opencap]
description = "Powerline opening cap when there is no SSH badge"
when = '[ -z "$SSH_CONNECTION" ] && [ -z "$SSH_TTY" ]'
command = 'printf ""'
format = "[](color_orange)"
shell = ["bash", "--noprofile", "--norc"]

[custom.ssh]
description = "Remote-session marker — only over SSH"
when = '[ -n "$SSH_CONNECTION" ] || [ -n "$SSH_TTY" ]'
command = 'printf ""'
# Icon only: spelling out "SSH" spent most of the badge's width on a word the
# colour already says. The badge opens the powerline itself (rounded cap in red)
# and hands off to orange, so there is exactly one opening cap on the line —
# two of them left a visible notch between the red and orange blocks.
format = "[](color_ssh)[󰢹 ](bold fg:color_fg0 bg:color_ssh)[](fg:color_ssh bg:color_orange)"
shell = ["bash", "--noprofile", "--norc"]

# Which tmux session this pane belongs to.
#
# Without this, two panes in different sessions look identical.
[custom.tmux]
description = "tmux session name"
when = '[ -n "$TMUX" ]'
command = 'tmux display-message -p "#S" 2>/dev/null'
format = "[[ $output ](fg:color_fg0 bg:color_bg3)]($style)"
style = "bg:color_bg3"
shell = ["bash", "--noprofile", "--norc"]

# Proxy on, and on which port.
#
# A proxy silently changes what curl, git and every package manager can reach.
# When something works on one machine and not the other, this is the first thing
# worth seeing rather than remembering.
[custom.proxy]
description = "Proxy indicator"
when = '[ -n "$http_proxy" ]'
# Only the port: the proxy URL may carry a user name and password.
command = 'printf "%s" "$http_proxy" | sed -nE "s#.*:([0-9]+)/?\$#\\1#p"'
format = "[[ ⇅$output ](fg:color_yellow bg:color_bg3)]($style)"
style = "bg:color_bg3"
shell = ["bash", "--noprofile", "--norc"]
